name: Apply review feedback fixes

on:
  push:
    branches:
      - docs/fix-stale-api-documentation

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-stale-api-documentation
      - name: Update score-history authentication notes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/docs/api/index.mdx')
          text = path.read_text()
          old = '**認証**: APIトークン（任意）。公開ユーザーは未認証で参照できます。非公開ユーザーは本人または承認済みフレンドのみ参照できます。'
          new = '**認証**: APIトークン必須。非公開ユーザーは本人または承認済みフレンドのみ参照できます。'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 score-history auth notes, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fixes
        run: |
          rm .github/workflows/address-review-feedback-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/api/index.mdx .github/workflows/address-review-feedback-temp.yml
          git commit -m "docs: address score-history auth review"
          git push
