name: Apply API documentation correction

on:
  push:
    branches:
      - docs/fix-stale-api-documentation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-stale-api-documentation
      - name: Update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/docs/api/index.mdx')
          text = path.read_text()

          replacements = [
              (
                  '静的データは認証不要で、通常のAPIのレートリミット対象外です。キャッシュ済みのため最新のAPIレスポンスより最大で約1時間古い場合があります。常に最新の情報が必要な場合は、認証付きの [`GET /v1/songs`](#get-v1songs) を使用してください。',
                  '静的データは認証不要で、通常のAPIのレートリミット対象外です。キャッシュ済みのため最新のAPIレスポンスより最大で約6時間古い場合があります。常に最新の情報が必要な場合は、認証付きの [`GET /v1/songs`](#get-v1songs) を使用してください。',
              ),
              (
                  'ほとんどのエンドポイントでAPIトークンが必要です。リクエストヘッダーに以下の形式でトークンを指定してください。',
                  '通常のAPIエンドポイントではAPIトークンが必要です。リクエストヘッダーに以下の形式でトークンを指定してください。',
              ),
              (
                  '\nスコア履歴取得（`GET /v1/*/score-history*`）のみAPIトークンは任意です。公開ユーザーは未認証で参照できます。非公開ユーザーのスコア履歴を参照する場合は、本人または承認済みフレンドのAPIトークンを送信してください。\n',
                  '\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-docs-temp.yml').unlink()
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/docs/api/index.mdx .github/workflows/patch-docs-temp.yml
          git commit -m 'docs: align API authentication and static data freshness'
          git push origin HEAD:docs/fix-stale-api-documentation
